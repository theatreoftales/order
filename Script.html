<script>
  const IS_STORE_OPEN = true;
  let productsData = [], cart = [], currentActiveImgUrl = "", currentSelectedProdIdx = null, toastTimeout = null, customerCache = {};
  let currentTempOrder = { customerInfo: null, cartItems: null, orderId: '', totalAmount: 0 };
  let selectedOptionIndex = 0; // Lưu lựa chọn hiện tại của sản phẩm

  window.addEventListener("DOMContentLoaded", function() {

    const bannerContainer = document.getElementById('storeBannerContainer');
    if (bannerContainer) {
      let bannerHtml = !IS_STORE_OPEN ? `<div class="store-closed-banner">（*＾-＾*）Tụi mình đang tạm nghỉ rồi. Bạn hãy quay lại sau nha!</div>` : '';
      bannerContainer.innerHTML = bannerHtml;
    }
    google.script.run.withSuccessHandler(renderProducts).getProducts();
    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(data) { if (data) customerCache = data; }).getAllCustomersForCache();
    }

    // Cấm chuột phải trên toàn bộ trang[cite: 1]
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Cấm phím F12 và hiện toast message trên toàn bộ trang[cite: 1]
    document.addEventListener("keydown", function(e) {
      if (e.key === "F12" || e.keyCode === 123) {
        e.preventDefault();
        showToast("Không cho F12 đấy lêu lêu!");
      }
    });
  });

  function renderProducts(products) {
    productsData = products || [];
    // Ẩn màn hình loading khi đã tải xong dữ liệu[cite: 1]
    const loadingBox = document.getElementById('loadingBox');
    if (loadingBox) loadingBox.style.display = 'none';
    
    filterProducts();
  }

  function filterProducts() {
    const searchInput = document.getElementById('searchInput');
    const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const container = document.getElementById('catalogContainer');
    if (!container) return;
    
    // Lọc sản phẩm theo từ khóa tìm kiếm[cite: 1]
    const filtered = productsData.filter(p => {
      const matchName = (p.name && p.name.toLowerCase().includes(keyword)) || (p.nameEn && p.nameEn.toLowerCase().includes(keyword));
      const matchOption = p.options && p.options.some(o => o.optionName && o.optionName.toLowerCase().includes(keyword));
      return matchName || matchOption;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:#666;">Không tìm thấy sản phẩm phù hợp.</div>`;
      return;
    }

    // Tách thành 2 mảng: Sản phẩm mới (isNew === true) và Các sản phẩm còn lại[cite: 1]
    const newProducts = filtered.filter(p => p.isNew === true);
    const otherProducts = filtered.filter(p => p.isNew !== true);

    let htmlOutput = '';

    const renderGridHtml = (prodList) => {
      return `<div class="products-grid">` + prodList.map((p) => {
        const idx = productsData.findIndex(item => item.name === p.name);
        const prodName = p.name;
        const priceText = `Từ ${Number(p.price).toLocaleString()}đ`;
        return `
          <div class="product-card" onclick="openProductDetail(${idx})">
            <div><img src="${p.images && p.images[0] ? p.images[0] : ''}"><h4>${prodName}</h4></div>
            <div><span class="price-pill">${priceText}</span></div>
          </div>`;
      }).join('') + `</div>`;
    };

    if (newProducts.length > 0) {
      htmlOutput += `<div class="section-title" style="margin-bottom: 15px; font-weight: bold; font-size: 1.2rem;">Sản phẩm mới</div>`;
      htmlOutput += renderGridHtml(newProducts);
    }

    if (newProducts.length > 0 && otherProducts.length > 0) {
      htmlOutput += `<div class="catalog-divider">‎‧₊˚✧Theatre of Tales✧˚₊‧</div>`;
    }

    if (otherProducts.length > 0) {
      htmlOutput += renderGridHtml(otherProducts);
    }

    container.innerHTML = htmlOutput;
  }

  function openProductDetail(prodIdx) {
    currentSelectedProdIdx = prodIdx;
    selectedOptionIndex = 0; // Reset về lựa chọn đầu tiên[cite: 1]
    const prod = productsData[prodIdx];
    currentActiveImgUrl = prod.images && prod.images[0] ? prod.images[0] : '';
    document.getElementById('detailMainImg').src = currentActiveImgUrl;
    const thumbContainer = document.getElementById('thumbnailList');
    if (prod.images && prod.images.length > 1) {
      thumbContainer.innerHTML = prod.images.map((imgUrl, i) => `<img src="${imgUrl}" class="thumb-img ${i===0?'active':''}" onclick="switchMainImg('${imgUrl}', this)">`).join('');
      thumbContainer.style.display = 'flex';
    } else { thumbContainer.style.display = 'none'; }

    document.getElementById('detailTitle').innerText = prod.name;
    document.getElementById('detailDescription').innerText = prod.description || "";

    const optListContainer = document.getElementById('detailOptionList');
    let optionsToRender = (prod.options && prod.options.length > 0) ? prod.options : [{ optionName: "Mặc định", price: prod.price, stock: prod.stock || 9999 }];
    
    // Chỉ hiện tên lựa chọn thay vì Tên lựa chọn + giá tiền[cite: 1]
    let optionsHtml = optionsToRender.map((opt, oIdx) => {
      const isSoldOut = (parseInt(opt.stock) === 0);
      return `
        <div class="option-pill-btn ${oIdx === 0 ? 'active' : ''} ${isSoldOut ? 'sold-out' : ''}" onclick="selectOption(${oIdx})">
          ${opt.optionName}
        </div>`;
    }).join('');

    optListContainer.innerHTML = optionsHtml;
    
    updateSelectedOptionPrice(optionsToRender[0]);

    const qtyInput = document.getElementById('selectedQty');
    qtyInput.type = "number";
    qtyInput.value = 1;
    
    updateActionBtnState();

    document.getElementById('catalogView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateSelectedOptionPrice(opt) {
    const priceElem = document.getElementById('detailPrice');
    if (opt && opt.price !== undefined) {
      priceElem.innerText = `${Number(opt.price).toLocaleString()}đ`;
    } else {
      const prod = productsData[currentSelectedProdIdx];
      priceElem.innerText = `${Number(prod.price).toLocaleString()}đ`;
    }
  }

  function selectOption(oIdx) {
    selectedOptionIndex = oIdx;
    const prod = productsData[currentSelectedProdIdx];
    let optionsToRender = (prod.options && prod.options.length > 0) ? prod.options : [{ optionName: "Mặc định", price: prod.price, stock: prod.stock || 9999 }];
    const selectedOpt = optionsToRender[oIdx];

    // Cập nhật lại giá tiền hiển thị tương ứng với lựa chọn[cite: 1]
    updateSelectedOptionPrice(selectedOpt);

    const pills = document.querySelectorAll('.option-pill-btn');
    pills.forEach((p, idx) => {
      if (idx === oIdx) p.classList.add('active');
      else p.classList.remove('active');
    });
    updateActionBtnState();
  }

  function updateActionBtnState() {
    const actionContainer = document.getElementById('actionBtnContainer');
    const qtyInput = document.getElementById('selectedQty');
    
    const prod = productsData[currentSelectedProdIdx];
    let optionsToRender = (prod.options && prod.options.length > 0) ? prod.options : [{ optionName: "Mặc định", price: prod.price, stock: prod.stock || 9999 }];
    const currentOpt = optionsToRender[selectedOptionIndex];
    const isSoldOut = (parseInt(currentOpt.stock) === 0);

    if (!IS_STORE_OPEN) {
      qtyInput.type = "number";
      qtyInput.disabled = false;
      qtyInput.value = 1;
      actionContainer.innerHTML = `<button class="btn btn-disabled btn-add-cart" disabled>Hàng trưng bày chưa bán</button>`;
    } else if (isSoldOut) {

      qtyInput.type = "text";
      qtyInput.value = "Hả?";
      qtyInput.disabled = true;
      actionContainer.innerHTML = `<button class="btn btn-disabled btn-add-cart" disabled>Hết hàng thật rồi mà!</button>`;
    } else {

      qtyInput.type = "number";
      qtyInput.disabled = false;
      qtyInput.value = 1;
      actionContainer.innerHTML = `<button class="btn btn-success btn-add-cart" onclick="addCurrentOptionToCart()">Thêm vào giỏ hàng</button>`;
    }
  }

  function changeQty(delta) {
    if (!IS_STORE_OPEN) return showToast("Hàng trưng bày chưa bán");
    const input = document.getElementById('selectedQty');
    if (input.value === "Hả?") return; 
    let val = parseInt(input.value) || 1;
    val = Math.max(1, val + delta);
    input.value = val;
  }

  function onInputQty() {
    const input = document.getElementById('selectedQty');
    if (input.value === "Hả?") return;
    let val = parseInt(input.value) || 1;
    if (val < 1) input.value = 1;
  }

  function addCurrentOptionToCart() {
    if (!IS_STORE_OPEN) return showToast("Hàng trưng bày chưa bán");
    const prod = productsData[currentSelectedProdIdx];
    let optionsToRender = (prod.options && prod.options.length > 0) ? prod.options : [{ optionName: "Mặc định", price: prod.price, stock: prod.stock || 9999 }];
    const opt = optionsToRender[selectedOptionIndex];
    
    if (parseInt(opt.stock) === 0) {
      return showToast("Sản phẩm này đã hết hàng!");
    }

    const input = document.getElementById('selectedQty');
    const qty = parseInt(input.value) || 1;

    const maxStock = opt.stock ? parseInt(opt.stock) : 9999;
    const cartKey = `${prod.name}_${opt.optionName}`;
    const existing = cart.find(i => i.key === cartKey);
    const currentCartQty = existing ? existing.quantity : 0;

    if (currentCartQty + qty > maxStock) {
      return showToast(`Chỉ còn ${maxStock} sản phẩm này thui nha!`);
    }

    if (existing) existing.quantity += qty;
    else cart.push({ key: cartKey, name: prod.name, option: opt.optionName, price: opt.price, quantity: qty, stock: maxStock });
    
    updateCartBadge();
    showToast(`Đã thêm ${qty} sản phẩm vào giỏ!`);
    input.value = 1;
  }

  function cleanPhone(str) { return str ? String(str).replace(/\D/g, "").replace(/^84/, "0") : ""; }

  function checkCustomerByPhone() {
    var phone = cleanPhone(document.getElementById('custPhone').value);
    if (phone && customerCache[phone]) {
      var info = customerCache[phone];
      document.getElementById('custName').value = info.name || '';
      document.getElementById('custEmail').value = info.email || '';
      document.getElementById('custAddress').value = info.address || '';
      document.getElementById('custFb').value = info.facebook || '';
    }
  }

  function switchMainImg(url, el) {
    currentActiveImgUrl = url;
    document.getElementById('detailMainImg').src = url;
    document.querySelectorAll('.thumb-img').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  }

  function zoomMainImage() { 
    if(!currentActiveImgUrl) return;
    document.getElementById('lightboxImg').src = currentActiveImgUrl; 
    document.getElementById('lightboxOverlay').style.display = 'flex'; 
  }

  function closeLightbox() { document.getElementById('lightboxOverlay').style.display = 'none'; }
  function showCatalogView() {
    document.getElementById('detailView').style.display = 'none';
    const fesView = document.getElementById('fesCalendarView');
    if (fesView) fesView.style.display = 'none';
    document.getElementById('catalogView').style.display = 'block';
  }

  // ===== LỊCH FES THAM GIA =====
  let fesEventsData = [];

  function openFesCalendar() {
    document.getElementById('catalogView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('fesCalendarView').style.display = 'block';
    document.getElementById('fesTimelineContainer').innerHTML =
      `<div style="text-align:center;padding:40px;color:#666;">Đang tải lịch fes...</div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    google.script.run
      .withSuccessHandler(renderFesTimeline)
      .withFailureHandler(function(err) {
        document.getElementById('fesTimelineContainer').innerHTML =
          `<div style="text-align:center;padding:40px;color:#d32f2f;">Lỗi tải dữ liệu: ${err.message}</div>`;
      })
      .getEvents();
  }

  function parseFesDate(str) {
    // Kỳ vọng backend trả dd/MM/yyyy. Trả về {dd, mm, yyyy} hoặc null nếu không hợp lệ.
    if (!str) return null;
    const parts = String(str).trim().split('/');
    if (parts.length !== 3) return null;
    return { dd: parts[0], mm: parts[1], yyyy: parts[2] };
  }

  function buildFesDateBlock(ev) {
    const start = parseFesDate(ev.startDate);
    const end = parseFesDate(ev.endDate);

    let dateText = "Đang cập nhật";
    let yearText = "";

    if (start && end) {
      const sameDay = (start.dd === end.dd && start.mm === end.mm && start.yyyy === end.yyyy);
      dateText = sameDay ? `${start.dd}/${start.mm}` : `${start.dd}/${start.mm} - ${end.dd}/${end.mm}`;
      yearText = (start.yyyy === end.yyyy) ? start.yyyy : `${start.yyyy} - ${end.yyyy}`;
    } else if (start) {
      dateText = `${start.dd}/${start.mm}`;
      yearText = start.yyyy;
    } else if (end) {
      dateText = `${end.dd}/${end.mm}`;
      yearText = end.yyyy;
    }

    const yearHtml = yearText ? `<div class="fes-date-year">${yearText}</div>` : "";
    return `<div class="fes-date-text">${dateText}</div>${yearHtml}`;
  }

  function renderFesTimeline(events) {
    fesEventsData = events || [];
    const container = document.getElementById('fesTimelineContainer');
    if (!container) return;

    if (fesEventsData.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:40px;color:#666;">Hiện chưa có lịch fes nào được cập nhật.</div>`;
      return;
    }

    const statusMap = {
      "sắp diễn ra": "status-upcoming",
      "đang diễn ra": "status-ongoing",
      "đã kết thúc": "status-ended"
    };

    const itemsHtml = fesEventsData.map(function(ev) {
      const statusKey = (ev.status || "").toLowerCase().trim();
      const statusClass = statusMap[statusKey] || "status-upcoming";
      const statusLabel = ev.status || "Sắp diễn ra";

      const dateBlockHtml = buildFesDateBlock(ev);
      const imgHtml = ev.image ? `<img class="fes-event-img" src="${ev.image}" alt="${ev.name}">` : "";
      const boothHtml = ev.booth ? `<span class="fes-booth-pill">Gian ${ev.booth}</span>` : "";
      const statusHtml = `<span class="fes-status-badge ${statusClass}">${statusLabel}</span>`;
      const contentHtml = ev.content ? `<div class="fes-event-desc">${ev.content}</div>` : "";

      return `
        <div class="fes-item">
          <div class="fes-date-col">${dateBlockHtml}</div>
          <div class="fes-dot-col"><span class="fes-dot"></span></div>
          <div class="fes-right-col">
            <div class="fes-date-mobile">${dateBlockHtml}</div>
            <div class="fes-content-box">
              ${imgHtml}
              <div class="fes-event-name">${(ev.name || '').toUpperCase()}</div>
              <div class="fes-meta-row">${boothHtml}${statusHtml}</div>
              ${contentHtml}
            </div>
          </div>
        </div>`;
    }).join('');

    container.innerHTML = `<div class="fes-timeline">${itemsHtml}</div>`;
  }

  function showToast(msg) {
    let t = document.getElementById('toastNotification');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toastNotification'; t.className = 'toast-notification';
      document.body.appendChild(t);
    }
    t.innerText = msg;
    t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function updateCartBadge() { document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.quantity, 0); }
  function openCartModal() { clearErrors(); renderCart(); openModal('cartModal'); }

  function renderCart() {
    const container = document.getElementById('cartList');
    const btnSubmit = document.getElementById('btnSubmitOrder');
    if (cart.length === 0) {
      container.innerHTML = "<div style='text-align:center;padding:20px;color:#666;'>Ở đây trống trải quá...</div>";
      document.getElementById('totalPrice').innerText = "Tổng: 0đ";
      if (btnSubmit) { btnSubmit.disabled = true; btnSubmit.className = "btn btn-disabled"; btnSubmit.innerText = "Ở đây trống trải quá..."; }
      return;
    }
    if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.className = "btn btn-success"; btnSubmit.innerText = "Xác nhận đơn Hàng"; }

    let total = 0;
    container.innerHTML = cart.map((item, idx) => {
      total += item.price * item.quantity;
      return `
        <div class="cart-item">
          <div style="flex:1;"><b>${item.name}</b><br><small>${item.option}</small><br><b style="color:#050c1a;">${Number(item.price).toLocaleString()}đ</b></div>
          <div class="qty-control">
            <button class="qty-btn" onclick="updateCartQty(${idx},-1)">-</button>
            <input type="number" class="qty-input" value="${item.quantity}" readonly>
            <button class="qty-btn" onclick="updateCartQty(${idx},1)">+</button>
          </div>
          <button onclick="removeFromCart(${idx})" class="btn-remove-item">
            <i class="fas fa-trash"></i>
          </button>
        </div>`;
    }).join('');
    document.getElementById('totalPrice').innerText = `Tổng: ${total.toLocaleString()}đ`;
  }

  function updateCartQty(idx, delta) {
    if (delta > 0 && cart[idx].quantity + delta > cart[idx].stock) return showToast(`Chỉ còn ${cart[idx].stock} thui nha!`);
    cart[idx].quantity += delta;
    if (cart[idx].quantity <= 0) cart.splice(idx, 1);
    updateCartBadge(); renderCart();
  }

  function removeFromCart(idx) { cart.splice(idx, 1); updateCartBadge(); renderCart(); }
  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function clearErrors() {
    ['Phone','Name','Email','Address','Fb'].forEach(k => {
      let f = document.getElementById('cust' + k), e = document.getElementById('err' + k);
      if (f) f.classList.remove('input-error'); if (e) { e.innerText = ''; e.style.display = 'none'; }
    });
  }

  function showError(fId, eId, msg) {
    let e = document.getElementById(eId), f = document.getElementById(fId);
    if (e) { e.innerText = msg; e.style.display = 'block'; }
    if (f) { f.classList.add('input-error'); f.focus(); }
  }

  function submitOrder(e) {
    if (e) e.preventDefault();
    clearErrors();
    
    let totalCartAmount = cart.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.quantity) || 0), 0);
    if (totalCartAmount < 100000) {
      return showToast("Đơn hàng của bạn phải có giá trị tối thiểu 100k");
    }

    const p = document.getElementById('custPhone').value.trim(), n = document.getElementById('custName').value.trim();
    const em = document.getElementById('custEmail').value.trim(), a = document.getElementById('custAddress').value.trim();
    const fb = document.getElementById('custFb').value.trim(), note = document.getElementById('custNote').value.trim();

    let valid = true;
    if (!p || !/^(0|\+84)[3|5|7|8|9][0-9]{8}$/.test(p)) { showError('custPhone','errPhone','Số điện thoại không hợp lệ (10 số)!'); valid = false; }
    if (!n) { showError('custName','errName','Vui lòng nhập Họ tên!'); valid = false; }
    if (!em || !/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(em)) { showError('custEmail','errEmail','Email dạng @gmail.com!'); valid = false; }
    if (!a) { showError('custAddress','errAddress','Vui lòng nhập Địa chỉ!'); valid = false; }
    if (!fb) { showError('custFb','errFb','Vui lòng nhập Link Facebook!'); valid = false; }

    if (!valid) return showToast("Hãy điền đủ thông tin giúp tụi mình nha!");

    const cInfo = { phone: p, name: n, email: em, address: a, facebook: fb, note: note };
    const btn = document.getElementById('btnSubmitOrder');
    btn.disabled = true; btn.innerText = "Đang xử lý...";

    currentTempOrder.customerInfo = cInfo; currentTempOrder.cartItems = cart;

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.innerText = "Xác nhận đơn Hàng";
        currentTempOrder.orderId = res.orderId; currentTempOrder.totalAmount = res.totalAmount;
        document.getElementById('resOrderId').innerText = res.orderId;
        document.getElementById('resTotalAmount').innerText = (Number(res.totalAmount)||0).toLocaleString();
        document.getElementById('qrImg').src = res.qrUrl;
        document.getElementById('qrStep1').style.display = 'block'; document.getElementById('qrStep2').style.display = 'none';
        document.getElementById('cartModal').style.display = 'none'; document.getElementById('paymentModal').style.display = 'flex';
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.innerText = "Xác nhận đơn Hàng";
        showToast("Lỗi: " + err.message);
      })
      .createOrderTemp(cInfo, cart);
  }

  function confirmPaymentDone() {
    const btn = document.getElementById('btnPaidConfirm');
    btn.disabled = true; btn.innerText = "Đang xác nhận...";
    google.script.run
      .withSuccessHandler(function() {
        document.getElementById('qrStep1').style.display = 'none'; 
        document.getElementById('qrStep2').style.display = 'block';
        cart = []; 
        updateCartBadge();
        btn.disabled = false; 
        btn.innerText = "Xác nhận đã thanh toán";
      })
      .withFailureHandler(function(err) { 
        alert("Lỗi: " + err.message); 
        btn.disabled = false; 
        btn.innerText = "Xác nhận đã thanh toán"; 
      })
      .confirmAndSaveOrder(currentTempOrder.customerInfo, currentTempOrder.cartItems, currentTempOrder.orderId, currentTempOrder.totalAmount);
  }

  function trackOrder() {
    const code = document.getElementById('trackInput').value.trim();
    const res = document.getElementById('trackResult');
    if (!code) return res.innerHTML = "<p style='color:red; font-size:13px;'>Vui lòng nhập mã đơn hàng!</p>";
    
    res.innerHTML = "<p style='text-align:center; color:#555;'>Chờ tụi mình xíu nha...</p>";
    
    google.script.run
      .withSuccessHandler(function(responseHtml) {
        res.innerHTML = responseHtml;
      })
      .trackOrderCode(code);
  }

  function closeReceiptPopup() {
    const popup = document.getElementById('receiptPopupOverlay');
    if (popup) {
      popup.remove();
    }
  }
</script>
